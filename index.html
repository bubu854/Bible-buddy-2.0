<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bible Buddy">
  <title>Bible Buddy 2.0</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>✝ Bible Buddy</h1>
    <button id="settings" data-page="settings" aria-label="Settings">⚙️</button>
  </header>
  <main>
    <h2>Welcome back!</h2>
    <p>Your Bible companion is here.</p>
    <section class="menu" aria-label="App menu">
      <button data-page="bible">📖 Read the Bible</button>
      <button data-page="buddy">🤖 Talk to Buddy</button>
      <button data-page="record">🎙️ Record a sermon</button>
      <button data-page="daily">✨ Daily verse</button>
      <button data-page="journal">📓 My journal</button>
      <button data-page="prayer">🙏 Prayer list</button>
      <button data-page="quiz">🧠 Bible quiz</button>
      <button data-page="plans">📅 Reading plans</button>
      <button data-page="maps">🗺️ Bible maps</button>
    </section>
    <section id="content" aria-live="polite">
      <h2>Today's reminder</h2>
      <p>“Be strong and courageous.” – Joshua 1:9</p>
      <p>Spend some time with God today.</p>
    </section>
  </main>
  <nav aria-label="Main navigation">
    <button data-page="home">Home</button>
    <button data-page="bible">Bible</button>
    <button data-page="buddy">Buddy</button>
    <button data-page="record">Record</button>
  </nav>
  <script src="./script.js"></script>
</body>
</html>
